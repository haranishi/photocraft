name: GPU recovery fixture verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-recovery-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PHOTOCRAFT_NO_PRINT: "1"
  LPDEST: photocraft-no-such-printer
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  recovery:
    name: recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3f3c186bec2ccf14da3d162945ed6e36d217a2c4
      - name: Verify tested source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "3f3c186bec2ccf14da3d162945ed6e36d217a2c4"
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Add completion markers to the pinned test fixture
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib
          import subprocess
          from pathlib import Path
          path = Path('crates/gpu/tests/device_loss.rs')
          data = subprocess.check_output(['git', 'show', 'HEAD:crates/gpu/tests/device_loss.rs'])
          assert hashlib.sha256(data).hexdigest() == '97fcb17bcf5318dfd0a2862729f105dc27aed1d7f3919cc4f89a84753dcc2b04'
          source = data.decode()
          assert path.read_text() == source
          old = '    }\n}\n\n#[test]\nfn render_recovers_effect_maps_after_invalid_encoder()'
          new = '    }\n    eprintln!("verified effect-map recovery assertions: encode_only={encode_only}");\n}\n\n#[test]\nfn render_recovers_effect_maps_after_invalid_encoder()'
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))
          print('The source hash matched; only a marker after the recovery assertions was added.')
          PYTHON
      - name: Verify effect-map recovery and print capability skips
        run: cargo test -p photocraft-gpu --test device_loss --locked recovers_effect_maps_after_invalid_encoder -- --nocapture
